name: Build Free macOS DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Apple Silicon DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          npx electron-builder --mac dmg --arm64 --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Composer-Workflow-Hub-v0.2.1-arm64
          path: release/*.dmg
